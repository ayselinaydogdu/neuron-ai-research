function matrix(){
  const head = COLS.map(c=>`<th title="${c[1]}">${c[0]}</th>`).join("");
  const rows = sites.map(s=>{
    const cells = s.cov.map((v,i)=>{
      const g = v===0?"—":(v===1?"◐":"●");
      const t = v===0?"Yok":(v===1?"Var ama elle / kural tabanlı":"Otomatik çalışıyor");
      return `<td><span class="cell s${v}" title="${COLS[i][1]}: ${t}" aria-label="${COLS[i][1]}: ${t}">${g}</span></td>`;
    }).join("");
    return `<tr><td class="site"><b>${s.n}</b> ${s.dom}</td>${cells}</tr>`;
  }).join("");
  return `<div class="matrix-wrap"><table class="mx"><thead><tr><th class="site">Site</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ══════════════════ RENDER + NAV ══════════════════ */
const deck = document.getElementById('deck');
deck.innerHTML = slides.map((s,i)=>`<section class="slide" id="s${i}" data-active="${i===0}" aria-hidden="${i!==0}">${s.html}</section>`).join("");

const rail = document.getElementById('rail');
rail.innerHTML = slides.map((s,i)=>{
  const gap = (i===5||i===26) ? '<span class="gap"></span>' : '';
  return `${gap}<button data-goto="${i}" title="${s.sec}" aria-label="${i+1}. sayfa: ${s.sec}"></button>`;
}).join("");

let cur = 0;
const counter = document.getElementById('counter');
const bar = document.getElementById('progress');
const prevB = document.getElementById('prev');
const nextB = document.getElementById('next');

function go(i, push){
  i = Math.max(0, Math.min(slides.length-1, i));
  const old = deck.children[cur];
  old.dataset.active = "false"; old.setAttribute('aria-hidden','true');
  cur = i;
  const el = deck.children[cur];
  el.dataset.active = "true"; el.setAttribute('aria-hidden','false');
  el.scrollTop = 0;
  counter.textContent = String(cur+1).padStart(2,'0') + " / " + slides.length;
  bar.style.width = ((cur+1)/slides.length*100) + "%";
  prevB.disabled = cur===0; nextB.disabled = cur===slides.length-1;
  [...rail.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-current', j===cur ? "true":"false"));
  const active = rail.querySelector('button[aria-current="true"]');
  if(active) active.scrollIntoView({block:'nearest', inline:'nearest'});
  if(push !== false) history.replaceState(null,"","#"+cur);
}

prevB.addEventListener('click', ()=>go(cur-1));
nextB.addEventListener('click', ()=>go(cur+1));
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-goto]');
  if(b) go(parseInt(b.dataset.goto,10));
});
document.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='Home'){ e.preventDefault(); go(0); }
  else if(e.key==='End'){ e.preventDefault(); go(slides.length-1); }
});

const start = parseInt((location.hash||"").replace('#',''),10);
go(Number.isFinite(start) ? start : 0);
</script>
